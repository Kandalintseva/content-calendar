name: Notification scheduler fallback

# Supabase Cron is the primary scheduler. Keep this workflow enabled as a free fallback.
# Duplicate deliveries are prevented atomically in the database.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger notification worker
        env:
          FUNCTION_URL: ${{ secrets.NOTIFICATION_FUNCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$FUNCTION_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Fallback is not configured yet; skipping."
            exit 0
          fi
          curl --fail-with-body --retry 2 --max-time 30 \
            -X POST "$FUNCTION_URL" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $CRON_SECRET" \
            -d '{"source":"github-actions"}'
